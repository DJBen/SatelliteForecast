<div id="station-live-mockup">
<style>
#station-live-mockup { --moon-accent:#a9b9ce; --moon-muted:#a3a8b2; --moon-page:#111214; --moon-card:#1c1e22; --moon-text:#eceef2; --moon-line:#33363d; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--moon-text); }
#station-live-mockup * { box-sizing:border-box; }
#station-live-mockup .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-bottom:18px; }
#station-live-mockup label { display:flex; align-items:center; gap:8px; font-size:13px; color:light-dark(#33363d,#a3a8b2); }
#station-live-mockup select { font:inherit; background:var(--moon-card); color:var(--moon-text); border:1px solid var(--moon-line); border-radius:9px; padding:10px; min-height:44px; }
#station-live-mockup .stage { padding:20px 8px; }
#station-live-mockup .phone { max-width:402px; margin:auto; background:var(--moon-page); border:1px solid var(--moon-line); border-radius:46px; padding:15px 13px 22px; }
#station-live-mockup .compact { display:flex; align-items:center; justify-content:space-between; width:218px; height:38px; border-radius:30px; padding:0 13px; margin:auto; background:#000; color:var(--moon-accent); font-size:14px; font-weight:600; }
#station-live-mockup .compact img { width:30px; height:30px; object-fit:contain; }
#station-live-mockup .day { text-align:center; font-size:18px; margin-top:25px; }
#station-live-mockup .clock { text-align:center; font-size:78px; font-weight:650; letter-spacing:-4px; line-height:1.2; font-variant-numeric:tabular-nums; }
#station-live-mockup .activity { margin-top:50px; padding:12px 16px 10px; border-radius:24px; background:radial-gradient(ellipse at 60% 105%,#a9b9ce14,transparent 80%),var(--moon-card); }
#station-live-mockup .header { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:36px; }
#station-live-mockup .identity { display:flex; align-items:center; gap:8px; min-width:0; }
#station-live-mockup .identity img { width:38px; height:36px; object-fit:contain; flex-shrink:0; }
#station-live-mockup .name { font-size:15px; font-weight:650; }
#station-live-mockup .status { font-size:11px; color:var(--moon-muted); margin-top:2px; }
#station-live-mockup .count { font-variant-numeric:tabular-nums; text-align:right; font-size:23px; font-weight:600; line-height:1; }
#station-live-mockup .count-label { font-size:11px; margin-top:4px; color:var(--moon-muted); text-align:right; }
#station-live-mockup .arc { display:block; width:100%; height:77px; margin-top:3px; overflow:visible; }
#station-live-mockup .arc text { font-family:inherit; font-size:11px; fill:var(--moon-muted); }
#station-live-mockup .arc .peak { fill:var(--moon-text); font-weight:600; }
#station-live-mockup .arc .lit { fill:none; stroke:var(--moon-accent); stroke-width:2.5; stroke-linecap:round; }
#station-live-mockup .arc .shadow { fill:none; stroke:var(--moon-muted); stroke-width:1.5; stroke-dasharray:3 4; }
#station-live-mockup .arc .horizon { stroke:var(--moon-line); stroke-width:1; }
#station-live-mockup .legend { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--moon-muted); font-size:11px; }
#station-live-mockup .key { display:inline-flex; align-items:center; gap:5px; }
#station-live-mockup .line { width:15px; border-top:2px solid var(--moon-accent); }
#station-live-mockup .dash { border-top:2px dashed var(--moon-muted); }
#station-live-mockup .lock-tools { display:flex; justify-content:space-between; margin:45px 16px 0; }
#station-live-mockup .tool { display:grid; place-items:center; width:43px; height:43px; border-radius:50%; background:var(--moon-card); }
#station-live-mockup .home { width:115px; height:4px; border-radius:4px; background:var(--moon-text); margin:24px auto 0; }
#station-live-mockup .caption { text-align:center; color:light-dark(#33363d,#a3a8b2); font-size:11px; letter-spacing:1.3px; text-transform:uppercase; margin:22px 0 10px; }
#station-live-mockup .expanded { max-width:374px; margin:auto; background:#000; border-radius:35px; padding:16px 22px 13px; }
#station-live-mockup .expanded .identity img { width:34px; height:34px; }
#station-live-mockup .example { color:light-dark(#33363d,#a3a8b2); text-align:center; font-size:11px; margin-top:14px; }
#station-live-mockup .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
@media(max-width:360px) { #station-live-mockup .stage { padding:16px 0; } #station-live-mockup .phone { padding:14px 9px 20px; } #station-live-mockup .activity { padding-inline:12px; } #station-live-mockup .expanded { padding-inline:18px; } #station-live-mockup .identity { gap:5px; } #station-live-mockup .identity img { width:32px; } }
</style>

      after:{status:'Pass finished',count:'✓',label:'complete',clock:'8:48',event:'Set 8:48 PM'}
    },
    fades:{
      soon:{status:'',count:'2:00',label:'until visible',clock:'8:38',event:'Rise 8:40 PM'},
      live:{status:'',count:'3:42',label:'until shadow',clock:'8:42',event:'Shadow 8:46 PM'},
      after:{status:'In Earth’s shadow',count:'1:18',label:'until set',clock:'8:46',event:'Set 8:48 PM'}
    }
  };
  const ns='http://www.w3.org/2000/svg';
  function draw(svg) {
    const pass=stations[state.station];
    const width=svg.getBoundingClientRect().width || 330;
    svg.setAttribute('viewBox',`0 0 ${width} 77`);
    svg.replaceChildren();
    function add(tag,attrs,text) { const el=document.createElementNS(ns,tag); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); if(text)el.textContent=text; svg.appendChild(el);return el; }
    const point=t=>[12+(width-24)*t,58-Math.sin(t*Math.PI)*(pass.peak/90)*51];
    function segment(a,b,cls) { const pts=Array.from({length:45},(_,i)=>point(a+(b-a)*i/44)); add('path',{class:cls,d:pts.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)).join(' ')}); }
    add('line',{class:'horizon',x1:12,y1:58,x2:width-12,y2:58});
    let transition=null;
    if(state.scenario==='full') segment(0,1,'lit');
    else if(state.scenario==='emerges') { transition=1-pass.shadow; segment(0,transition,'shadow'); segment(transition,1,'lit'); }
    else { transition=pass.shadow; segment(0,transition,'lit'); segment(transition,1,'shadow'); }
    if(transition!==null) {
      const [sx,sy]=point(transition);
      add('circle',{cx:sx,cy:sy,r:3,fill:'#111214',stroke:'#a9b9ce','stroke-width':1.5});
    }
    const [px,py]=point(.5);
    add('text',{class:'peak',x:px,y:py-8,'text-anchor':'middle'},pass.peak+'° peak');
    add('text',{x:12,y:74},pass.start+' · 0°');
    add('text',{x:width-12,y:74,'text-anchor':'end'},pass.end+' · 0°');
    const illumination={full:'sunlit throughout the above-horizon pass',emerges:'starts in shadow and becomes sunlit on ascent',fades:'starts sunlit and enters shadow on descent'}[state.scenario];
    svg.setAttribute('aria-label',`${state.station} example: rises ${pass.start}, peaks at ${pass.peak} degrees, ${illumination}, sets ${pass.end}. Solid means sunlit; dashed means shadow. No live position marker.`);
  }
  function render() {
    const p=examples[state.scenario][state.phase];
    const put=(selector,value)=>root.querySelectorAll(selector).forEach(el=>el.textContent=value);
    put('[data-name]',state.station); put('[data-count]',p.count); put('[data-count-label]',p.label); put('[data-clock]',p.clock);
    const status=state.phase==='soon' && state.scenario!=='emerges'?(state.station==='ISS'?'Starts southwest':'Starts west'):p.status;
    put('[data-status]',status);
    root.querySelectorAll('[data-status]').forEach(el=>{el.hidden=!status;});
    root.querySelectorAll('[data-shadow-key]').forEach(el=>{el.style.display=state.scenario==='full'?'none':'';});
    put('[data-event]',p.event);
    root.querySelectorAll('[data-icon]').forEach(el=>{el.src=assets[state.station];});
    root.querySelector('[data-station]').value=state.station;root.querySelector('[data-phase]').value=state.phase;root.querySelector('[data-scenario]').value=state.scenario;
    root.querySelectorAll('.arc').forEach(draw);
    put('[data-announcement]',state.station+(p.status?', '+p.status:''));
  }
  root.querySelector('[data-station]').addEventListener('change',e=>{state.station=e.target.value;render();});
  root.querySelector('[data-phase]').addEventListener('change',e=>{state.phase=e.target.value;render();});
  root.querySelector('[data-scenario]').addEventListener('change',e=>{state.scenario=e.target.value;render();});
  render();
  const observer=new ResizeObserver(()=>root.querySelectorAll('.arc').forEach(draw));
  root.querySelectorAll('.arc').forEach(svg=>observer.observe(svg));
  if(globalThis.Tweak) { const tweak=new Tweak({container:root,onChange:render}); tweak.addSelect(state,'station',{label:'Station',options:['ISS','Tiangong']}); tweak.addSelect(state,'scenario',{label:'Illumination',options:[{label:'Fully illuminated',value:'full'},{label:'Appears from shadow',value:'emerges'},{label:'Fades into shadow',value:'fades'}]}); tweak.addSelect(state,'phase',{label:'Pass moment',options:[{label:'Before',value:'soon'},{label:'Sunlit',value:'live'},{label:'After viewing',value:'after'}]}); }
})();
</script>
</div>
