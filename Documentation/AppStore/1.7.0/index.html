<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satellite Forecast — App Store screenshots</title><style>body{background:#0b1420;color:#e9f1fa;font:16px system-ui;margin:32px}h1{font-size:30px}p{max-width:900px;color:#b8c9dc}select{font:inherit;padding:8px;background:#233244;color:white;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:1300px}img{width:100%;border-radius:14px}h2{margin-top:40px}h3{font-size:15px;color:#8ee0db}@media(max-width:700px){body{margin:16px}.grid{gap:8px}h3{font-size:11px}}</style><h1>Satellite Forecast · 1.7.0</h1><p>Real simulator captures at 1320 × 2868. The new set uses a September 9 evening forecast: a 56° ISS pass with a star-filled sky and an 87° Tiangong pass. The overview, pass details, globe and satellite catalog show the current app.</p><label>Language <select id="locale"></select></label><main id="gallery"></main><script>
const locales=['en-US','fr-FR','es-ES','pt-BR','ru','ja','ko','zh-Hans'];
const slots=['01-forecast','02-pass-chart','03-pass-list','04-satellites'];
const names=['Forecast overview','Pass details','Pass list and globe','Satellite categories'];
locale.innerHTML=locales.map(x=>`<option>${x}</option>`).join('');
function render(){gallery.innerHTML=slots.map((s,i)=>`<h2>${i+1}. ${names[i]}</h2><div class="grid"><section><h3>Original store images</h3><img loading="lazy" src="before/${locale.value}/${String(i+1).padStart(2,'0')}.png"></section><section><h3>Previous capture</h3><img loading="lazy" src="round-2/${locale.value}/${s}.png"></section><section><h3>New · build 4</h3><a href="screenshots/${locale.value}/${s}.png"><img loading="lazy" src="screenshots/${locale.value}/${s}.png"></a></section></div>`).join('')};locale.onchange=render;render();
</script></html>
