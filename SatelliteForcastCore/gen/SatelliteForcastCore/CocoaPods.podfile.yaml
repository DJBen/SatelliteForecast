---
installation_method:
  name: cocoapods
  options:
    :deterministic_uuids: true
    :disable_input_output_paths: false
    :generate_multiple_pod_projects: false
    :incremental_installation: false
    :share_schemes_for_development_pods: false
    :warn_for_multiple_pod_sources: true
workspace: SatelliteForcastCore.xcworkspace
sources:
  - https://cdn.cocoapods.org/
plugins:
  cocoapods-disable-podfile-validations:
    no_abstract_only_pods: true
  cocoapods-generate:
    {}
target_definitions:
  - abstract: true
    children:
      - abstract: true
        dependencies:
          - SatelliteKit:
            - :path: "../../../SatelliteKit"
        name: Transitive Dependencies
      - name: App-iOS
    dependencies:
      - SatelliteForcastCore:
        - :path: "../../SatelliteForcastCore.podspec"
      - SatelliteForcastCore/Tests:
        - :path: "../../SatelliteForcastCore.podspec"
    name: Pods
    user_project_path: SatelliteForcastCore.xcodeproj
    uses_frameworks:
      :linkage: :dynamic
      :packaging: :framework
